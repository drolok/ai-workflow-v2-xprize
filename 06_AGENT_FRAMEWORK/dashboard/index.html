<!doctype html><meta charset="utf-8"><title>WorkEvent · local</title><style>body{font:14px system-ui;margin:24px;background:#0d1117;color:#dce3ea}h1{margin:0}.sub{color:#9da9b6}section{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.metric{font-size:22px}.event{border-top:1px solid #30363d;padding:10px 0}.tag{background:#26364d;border-radius:12px;padding:3px 8px;font-size:12px}select,a{color:#8cc8ff;background:#0d1117;padding:6px}small{color:#9da9b6}.disabled{opacity:.55;pointer-events:none}</style><h1>WorkEvent · flujo local</h1><p class=sub id=status>Conectando SSE…</p><section><div class=grid><div>Tokens hoy<div class=metric id=tokens>0</div></div><div>Latencia por modelo<div id=latency></div></div><div>Éxito por tipo<div id=success></div></div><div>Eventos/hora<div id=hourly></div></div></div></section><section><label>Filtrar <select id=filter><option value="">Todos los tipos</option><option>tool_evaluation</option><option>decision</option><option>experiment</option><option>verification</option><option>blocker</option><option>incident</option><option>outcome</option></select></label><div id=feed></div></section><section><b>Preparado para escalar</b><p><a class=disabled href="http://localhost:6006">Phoenix :6006 — no levantado todavía</a> · <a class=disabled href="http://localhost:3000">Langfuse :3000 — no levantado todavía</a></p></section><script>let state={events:[],analytics:{}};const $=id=>document.getElementById(id);function render(d){state=d;$('tokens').textContent=d.analytics.tokens_today||0;$('latency').innerHTML=(d.analytics.latency_by_model||[]).map(x=>`${x.model}: avg ${x.avg_seconds}s · p95 ${x.p95_seconds}s`).join('<br>')||'Sin duración aún';$('success').innerHTML=(d.analytics.success_by_type||[]).map(x=>`${x.type}: ${x.rate}% (${x.count})`).join('<br>')||'—';$('hourly').innerHTML=(d.analytics.events_by_hour||[]).slice(-6).map(x=>`${x.hour.slice(11)} ${x.count}`).join('<br>')||'—';const f=$('filter').value;$('feed').innerHTML=d.events.filter(e=>!f||e.event_type===f).map(e=>`<div class=event><span class=tag>${e.event_type}</span> <b>${e.outcome}</b> · ${e.model||'unknown'}<br>${e.action}<br><small>${e.occurred_at} · ${e.metrics.elapsed_minutes??'—'} min · ${e.metrics.tokens_read_estimate??'—'} tokens · ${e.artifact_refs[0]}</small></div>`).join('')||'<p>Esperando eventos…</p>'}$('filter').onchange=()=>render(state);const es=new EventSource('/events');es.onopen=()=>$('status').textContent='SSE conectado — actualiza sin refrescar';es.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}};es.onerror=()=>$('status').textContent='Reconectando SSE…';</script>
